% SU2-NEMO settings that this PSE solver assumes / reads back.
% Not a complete SU2 configuration: merge with your own case file.
%
% Physics (must match the "gas" section of the PSE JSON config)
SOLVER= NEMO_NAVIER_STOKES
KIND_TURB_MODEL= NONE            % ILES: the laminar NEMO solver, no SGS model
FLUID_MODEL= SU2_NONEQ           % gas.library = "su2tclib"
GAS_MODEL= AIR-7                 % species order e-, N2, O2, NO, N, O, NO+
% FLUID_MODEL= MUTATIONPP        % gas.library = "mutationpp"
% GAS_MODEL= air_7               % ship mutationpp_data/ in MPP_DATA_DIRECTORY
GAS_COMPOSITION= (1E-12, 0.767, 0.233, 1E-12, 1E-12, 1E-12, 1E-12)
TRANSPORT_COEFF_MODEL= WILKE     % gas.transport  (WILKE | GUPTA-YOS | SUTHERLAND)
FROZEN_MIXTURE= NO               % gas.frozen
AXISYMMETRIC= YES                % baseflow.su2.plane = "axisym"
%
% Wall (wall_bc in the PSE config)
MARKER_ISOTHERMAL= ( wall, 1000.0 )
%
% Unsteady ILES: write snapshots, the PSE averages them
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW)
VOLUME_OUTPUT= (SOLUTION, PRIMITIVE)   % writes Temperature_tr / Temperature_ve
OUTPUT_WRT_FREQ= 200
RESTART_FILENAME= restart_flow          % -> restart_flow_00200.csv, ...
MESH_FORMAT= SU2
