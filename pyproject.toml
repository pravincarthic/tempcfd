[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pse-mack"
version = "1.0.0"
description = "Parabolised stability equations for second Mack-mode instabilities in 11-species Park two-temperature air, driven by OpenFOAM v1706 / hy2Foam solutions"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
io = ["h5py>=3.8"]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7.0"]

[project.scripts]
pse-mack = "pse.driver:main"

[tool.setuptools.packages.find]
include = ["pse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
