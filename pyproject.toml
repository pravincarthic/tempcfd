[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pse-nemo"
version = "2.0.0"
description = "LST, LPSE and NPSE for hypersonic boundary layers from SU2-NEMO (AIR-7, TTv), with SU2TCLib or Mutation++ thermochemistry"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
io = ["h5py>=3.8"]
plot = ["matplotlib>=3.6"]
mutationpp = ["mutationpp"]
test = ["pytest>=7.0"]

[project.scripts]
pse-nemo = "pse.driver:main"

[tool.setuptools.packages.find]
include = ["pse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
